apiVersion: apps/v1
kind: Deployment
metadata:
  name: demucs-worker
  labels:
    app: demucs-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demucs-worker
  template:
    metadata:
      labels:
        app: demucs-worker
    spec:
      containers:
        - name: demucs-worker
          image: us-central1-docker.pkg.dev/lab2-507502/lab7-images/lab7-worker:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: S3_ENDPOINT
              value: rustfs-svc.rustfs-ns.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: secret-key
            - name: S3_SECURE
              value: "false"
          resources:
            requests:
              memory: "6Gi"
              cpu: "1000m"
            limits:
              memory: "10Gi"
              cpu: "4000m"
